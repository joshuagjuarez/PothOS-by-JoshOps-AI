      <main>
        <section><h2>Meet PothOS</h2><p>Your own AI computing environment. PothOS brings a continuing ArcheAgent, memory, files, local computing, tools and workflows into one personal environment. Connect the AI engines and devices you use, and keep your identity, preferences and work together. It is a full software stack: the interfaces you use, a layer for work, memory and orchestration, and a local runtime on supported hardware you choose. Memory with roots keeps recorded, inferred, corrected and proposed information apart. Worlds keep home, a professional practice and a small business separate, each with its own sharing boundary. ArcheAgents are continuing digital representatives with identity, memory and responsibilities that cooperate only where you allow.</p><p><a href="/pothos">Explore PothOS</a> · <a href="/pricing">See pricing</a> · <a href="/docs">Read product documentation</a></p></section>
        <section><h2>Built around your world</h2><p>Use cases: individuals and households, independent professionals, creators and small businesses.</p></section>
        <section><h2>Ventures</h2><p>Purpose Link is a Houston community-resource navigation venture (<a href="https://purposelink.joshops.ai/">purposelink.joshops.ai</a>). Bare Sole Media is a photography, video, and storytelling venture.</p><p><a href="/ventures">View ventures</a></p></section>
        <section><h2>Next horizons</h2><p>JoshOps AI is researching portable interfaces, robotics and continuity across screens. This work is in research and development.</p><p><a href="/research">View public R&amp;D</a></p></section>
        <section><h2>Start with PothOS</h2><p>PothOS is free. Always. PothOS software is free for personal, nonprofit and business use. The software price is $0, with no subscription, per-ArcheAgent, device, seat, business or enterprise software fee. Adding more ArcheAgents never creates a software charge. Free public downloads of JoshOps AI are available, and shared source and documentation are public in the PothOS repository. Standalone runtime source remains separately governed by the published licensing status: https://github.com/joshuagjuarez/PothOS-by-JoshOps-AI/blob/main/LICENSE_STATUS.md. Hardware, optional third-party hosting, external AI subscriptions or API usage, and model licenses are separate. There is no promise of unlimited compute or a permanently funded hosted service. The hosted invitation controls access; it is never a payment requirement. The hosted beta currently requires an invitation and your own account. Free-access migration is in progress. If your account still shows a payment prompt, contact support; do not start a new paid subscription. Organization administration and developer tooling are release work in progress, not a separate paid tier.</p><p><a href="/pricing">Pricing details</a></p></section>
        <section><h2>JoshOps AI</h2><p>JoshOps AI is your local agentic computing environment. Your PothOS and ArcheAgent bring memory, files, tools and ongoing work together across your connected devices. Personal: Keep continuity across your notes, files and projects. Entrepreneur: Organize ventures, contacts and repeatable work. Enterprise: Coordinate accountable work and connect authorized Google Workspace services. Developer: Use connected chat to invoke permitted local tools and workflows, read and edit source, run supported checks and recover work. Personal, Entrepreneur, Enterprise and Developer are uses of the same environment, not separate apps or paid tiers. Designed to work with Google Workspace using each person's own authorized accounts. Build with us. We welcome development, design, testing, documentation, sponsorship and infrastructure partnerships. Support for the project is a contribution, not an investment, and carries no return or equity. Build with us: https://github.com/joshuagjuarez/PothOS-by-JoshOps-AI/issues/new?template=developer-participation.yml. Discussions: https://github.com/joshuagjuarez/PothOS-by-JoshOps-AI/discussions. Support the project: https://github.com/joshuagjuarez/PothOS-by-JoshOps-AI/blob/main/docs/SUPPORT-THE-PROJECT.md.</p></section>
